[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "burstgpt-bench"
version = "0.2.0"
description = "A simple BurstGPT-driven request generator / profiler for LLM serving frameworks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.8.6",
    "numpy>=1.25.1",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
# Only needed for scripts/preprocess_sharegpt.py
preprocess = [
    "scipy>=1.14.0",
    "transformers>=4.41.1",
    "matplotlib>=3.7",
]
dev = ["pytest>=7.0"]

[project.scripts]
burstgpt-bench = "burstgpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
